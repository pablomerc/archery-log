<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Archery Log</title>
<meta name="description" content="Track arrow volume, plan for competitions, and see your training load over time.">
<meta name="theme-color" content="#b5442e" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Archery">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="top-inner">
    <div class="brand">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="#fff" stroke="#16191d" stroke-width="1.3"/>
        <circle cx="12" cy="12" r="7" fill="#2f6f9f"/>
        <circle cx="12" cy="12" r="4.2" fill="#b5442e"/>
        <circle cx="12" cy="12" r="1.7" fill="#d99a1e"/>
      </svg>
      <span>Archery Log<span class="brand-sub" id="brandSub"></span></span>
    </div>
    <div class="spacer"></div>
    <button class="btn ghost sm" id="themeBtn" title="Switch light / dark" aria-label="Switch theme">
      <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
    </button>
  </div>
</header>

<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-view="dash" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/></svg>
    <span>Dashboard</span>
  </button>
  <button role="tab" data-view="log" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    <span>Log</span>
  </button>
  <button role="tab" data-view="plan" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h9"/></svg>
    <span>Plan</span>
  </button>
  <button role="tab" data-view="cal" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
    <span>Calendar</span>
  </button>
  <button role="tab" data-view="gear" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    <span>Gear</span>
  </button>
  <button role="tab" data-view="settings" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-6 8-6s8 2 8 6"/></svg>
    <span>You</span>
  </button>
</nav>

<main class="app">
  <div id="shareBanner"></div>

  <section class="view active" id="view-dash" role="tabpanel" aria-label="Dashboard"></section>
  <section class="view" id="view-log" role="tabpanel" aria-label="Log a practice"></section>
  <section class="view" id="view-plan" role="tabpanel" aria-label="Training plan"></section>
  <section class="view" id="view-cal" role="tabpanel" aria-label="Calendar"></section>
  <section class="view" id="view-gear" role="tabpanel" aria-label="Gear"></section>
  <section class="view" id="view-settings" role="tabpanel" aria-label="Settings"></section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<dialog id="dlg"><div class="dlg-body" id="dlgBody"></div></dialog>

<script src="js/store.js"></script>
<script src="js/parse.js"></script>
<script src="js/plan.js"></script>
<script src="js/charts.js"></script>
<script src="js/views.js"></script>
<script src="js/views2.js"></script>
<script src="js/app.js"></script>
</body>
</html>
